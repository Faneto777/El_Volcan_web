<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Volcán · Acceso Repartidor</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="pagina-login">
    <main class="app-login">
      <header class="cabecera-marca">
        <img src="../assets/logo/logosinfondo.png" alt="Logo Distribuidora El Volcán" class="logo-marca" />
        <h1>El Volcán</h1>
        <p>Ingresa con tu cuenta para ver tus entregas asignadas.</p>
      </header>

      <form id="formLoginRepartidor" class="form-login" novalidate>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="nombre@gmail.com" required />

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />

        <p class="mensaje-exito" aria-live="polite"></p>

        <button type="submit" class="boton-primario">Iniciar sesión</button>
        <button type="button" class="boton-demo" id="btnUsarDemoRepartidor">Usar cuenta de prueba</button>
      </form>

      <footer class="pie-login">
        <p>Cuenta de prueba: <strong>repartidordemo@gmail.com</strong> / <strong>demo123</strong></p>
        <a href="../cliente/index.html">Volver al sitio del cliente</a>
      </footer>
    </main>

    <script src="../js/validaciones.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
